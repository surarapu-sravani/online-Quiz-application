<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { text-align: center; padding-top: 50px; background-color: #f0f8ff; font-family: Arial; }
        form { display: inline-block; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
        input { display: block; margin: 15px auto; padding: 10px; width: 80%; border-radius: 5px; border: 1px solid #ccc; }
        button { display: block; margin: 20px auto 0; padding: 10px 30px; font-size: 16px; background: #4da6ff; color: white; border: none; border-radius: 5px; cursor: pointer; transition: transform 0.3s; }
        button:hover { transform: scale(1.1); }
        a { color: #4da6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>📝 Register</h1>
    <form method="post">
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="/login">Login</a></p>
</body>
</html>
