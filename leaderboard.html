<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            text-align: center;
            padding: 50px;
            background-color: #f0f8ff;
            font-family: Arial;
        }
        h1 {
            margin-bottom: 30px;
        }
        table {
            width: 80%;
            margin: 0 auto 30px;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px #ccc;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }
        th {
            background-color: #4da6ff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        a {
            display: inline-block;
            padding: 10px 25px;
            font-size: 16px;
            background: #4da6ff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: transform 0.3s;
        }
        a:hover {
            transform: scale(1.05);
            background: #3399ff;
        }
    </style>
</head>
<body>
    <h1>🏆 Leaderboard (Top 10)</h1>
    <table>
        <tr>
            <th>Rank</th>
            <th>Username</th>
            <th>Score</th>
            <th>Time Taken (sec)</th>
        </tr>
        {% for row in data %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/quiz">Back to Quiz</a>
</body>
</html>
