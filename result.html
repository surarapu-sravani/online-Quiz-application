<!DOCTYPE html>
<html>
<head>
    <title>Quiz Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { 
            text-align: center; 
            padding-top: 50px; 
            background-color: #f0f8ff; 
            font-family: Arial; 
        }
        .card { 
            display: inline-block;
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 0 10px #ccc; 
            margin-bottom: 20px;
        }
        p { 
            font-size: 18px; 
            margin: 10px 0; 
        }
        a { 
            display: inline-block; 
            margin: 10px; 
            padding: 10px 20px; 
            font-size: 16px; 
            background: #4da6ff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            transition: transform 0.3s; 
        }
        a:hover { 
            transform: scale(1.05); 
            background: #3399ff;
        }
    </style>
</head>
<body>
    <h1>🎉 Quiz Result</h1>
    <div class="card">
        <p><b>Your Score:</b> {{ score }}</p>
        <p><b>Time Taken:</b> {{ time }} seconds</p>
    </div>
    <div>
        <a href="/leaderboard">View Leaderboard</a>
        <a href="/quiz">Try Again</a>
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
